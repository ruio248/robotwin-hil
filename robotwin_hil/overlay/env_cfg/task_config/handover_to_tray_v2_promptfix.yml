# v2 contract: clean instruction template plus the interior geometry
# distribution implemented by envs/handover_to_tray.py.
render_freq: 0
episode_num: 500
use_seed: false
save_freq: 15
embodiment:
- aloha-agilex
language_num: 2
eval_instruction: seen
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
save_path: ./data
clear_cache_freq: 5
collect_data: true
save_video: false
eval_video_log: false
source_side: left
geometry_profile: v2_interior
